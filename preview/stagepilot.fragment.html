 .sp-primary{flex:1}#stagepilot-preview .sp-stage-controls .sp-iconbtn{height:45px;width:45px}#stagepilot-preview .sp-transpose{display:flex;align-items:center;border:1px solid #33363c;border-radius:10px;gap:2px;padding:2px;font:12px 'JetBrains Mono'}#stagepilot-preview .sp-transpose button{width:31px;height:36px;border:0;background:transparent;color:#f2f1ed}#stagepilot-preview .sp-stage.locked .sp-stage-chart{outline:2px solid var(--sp-accent);outline-offset:-5px}#stagepilot-preview .sp-web .sp-stage-chart{max-width:680px;width:100%;margin:auto;padding-top:15px}#stagepilot-preview .sp-web .sp-stage-controls{justify-content:center}#stagepilot-preview .sp-web .sp-stage-controls .sp-primary{flex:0 1 210px}#stagepilot-preview .sp-web .sp-stage .sp-piece{font-size:25px}#stagepilot-preview .sp-web .sp-stage-top{padding:22px 30px}#stagepilot-preview .sp-web .sp-stage-sections{justify-content:center}#stagepilot-preview .sp-web .sp-stage-next{justify-content:center}#stagepilot-preview .sp-modal-overlay{position:absolute;inset:0;background:#0009;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px}#stagepilot-preview .sp-modal{width:100%;max-width:410px;max-height:100%;overflow:auto;background:#191b20;border:1px solid #3b3e46;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0005}#stagepilot-preview .sp-modal h2{font-size:21px;letter-spacing:-.6px}#stagepilot-preview .sp-modal .sp-sub{margin:9px 0}#stagepilot-preview .sp-modal label{font-size:11px;color:var(--sp-muted)}#stagepilot-preview .sp-toast{position:absolute;bottom:87px;left:16px;right:16px;z-index:7;padding:13px 16px;border-radius:12px;background:#e2e9e3;color:#19291e;font-size:12px;box-shadow:0 8px 30px #0004;display:flex;gap:8px;align-items:center}#stagepilot-preview .sp-web .sp-toast{left:auto;max-width:390px;bottom:20px}#stagepilot-preview .sp-toast svg{width:16px;height:16px}

@media(max-width:480px){#stagepilot-preview .sp-preview-tag{display:none}#stagepilot-preview .sp-preview-bar{padding-right:0}#stagepilot-preview .sp-platform button{padding:8px 12px}#stagepilot-preview .sp-web{grid-template-columns:1fr}#stagepilot-preview .sp-sidebar{display:none}#stagepilot-preview .sp-web .sp-bottom{display:flex}#stagepilot-preview .sp-title{font-size:27px}#stagepilot-preview .sp-stage .sp-piece{font-size:18px}#stagepilot-preview .sp-stage-chart{padding:7px 20px 24px}#stagepilot-preview .sp-top{padding-left:19px;padding-right:19px}#stagepilot-preview .sp-android .sp-main{padding-left:19px;padding-right:19px}#stagepilot-preview .sp-hero{padding:19px}#stagepilot-preview .sp-form-grid{gap:9px}#stagepilot-preview .sp-songmeta{gap:9px}#stagepilot-preview .sp-reorder button{width:27px}#stagepilot-preview .sp-stage-controls{gap:7px;padding:12px 13px 17px}}

<script>
(()=>{
const root=document.getElementById('stagepilot-preview');
const mount=root.querySelector('#sp-mount');
const icons={home:'house',songs:'library',sets:'list-music',practice:'audio-lines',stage:'play',import:'clipboard-paste'};
const titles={home:'Oggi',songs:'Repertorio',sets:'Scalette',practice:'Prove'};
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sample=`Ultimo giro chords by COPYCUT\nTuning: E A D G B E\nKey: Am\nCapo: No capo\nDifficulty: beginner\nLast update: 2 days ago\n\n[Intro]\nAm    F    C    G\n\n[Verse 1]\nAm                     F\nLa città si accende e noi restiamo qui\nC                    G\nTra le luci e il suono di un altro venerdì\n\n[Chorus]\nF              C\nSuona ancora, suona forte\nG                Am\nQuesta notte non finisce mai`;
let saved=window.openai?.widgetState?.privateContent||{};
let state={platform:saved.platform==='web'?'web':'android',page:saved.page||'home',filter:'all',query:'',live:0,section:1,tr:0,playing:false,locked:false,raw:sample,cleaned:false,modal:null,toast:'',timer:0,practicing:false,accent:saved.palette==='ice-blue-v1'&&saved.accent?saved.accent:'#7fb7ff',radius:20};
let songs=[
 {id:'s1',title:'Ultimo giro',artist:'COPYCUT',key:'Am',bpm:142,dur:'3:20',status:'ready',note:'Attacco secco. Finale tutti insieme.'},
 {id:'s2',title:'Still burning',artist:'COPYCUT',key:'D',bpm:72,dur:'4:10',status:'rehearse',note:'Rivedere l’ingresso dopo il secondo ritornello.'},
 {id:'s3',title:'Luci di città',artist:'COPYCUT',key:'Em',bpm:126,dur:'3:40',status:'ready',note:'Ultimo ritornello due volte, chiusura secca.'},
 {id:'s4',title:'La strada di casa',artist:'COPYCUT',key:'G',bpm:108,dur:'4:05',status:'ready',note:''},
 {id:'s5',title:'Tutto il rumore',artist:'COPYCUT',key:'Bm',bpm:118,dur:'3:30',status:'study',note:'Studiare il bridge. Partenza solo voce e chitarra.'},
 {id:'s6',title:'Fino all’alba',artist:'COPYCUT',key:'C',bpm:96,dur:'4:25',status:'ready',note:''}
];
let set=songs.map(s=>s.id),toastTimer,playingTimer;
const statusText={ready:'Pronto',rehearse:'Da ripassare',study:'Da studiare'};
const sec=s=>s.split(':').reduce((a,v)=>a*60+Number(v),0);
const mm=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
const total=()=>set.reduce((n,id)=>n+sec(songs.find(s=>s.id===id).dur),0);
const status=s=>`<span class="sp-status ${s.status}"><i></i>${statusText[s.status]}</span>`;
function persist(){window.openai?.setWidgetState({modelContent:{prodotto:'StagePilot',interfaccia:state.platform,schermata:state.page,accento:state.accent},privateContent:{platform:state.platform,page:state.page,accent:state.accent,palette:'ice-blue-v1'}})?.catch(()=>{});}
function toast(text){state.toast=text;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast='';render()},3200)}
function navigate(page){state.page=page;state.modal=null;state.toast='';render();persist()}
function nav(){return Object.keys(titles).map(p=>`<button data-page="${p}" class="${state.page===p?'active':''}" ${state.page===p?'aria-current="page"':''}>${icon(icons[p])}<span>${titles[p]}</span></button>`).join('')}
function pageHead(title,sub,action=''){return `<div class="sp-page-head"><div><h1 class="sp-title">${title}</h1><p class="sp-sub">${sub}</p></div>${action}</div>`}
function home(){const pending=songs.filter(s=>s.status!=='ready').length;return `${pageHead('La tua musica.<br>Il tuo prossimo palco.','Tutto pronto, un brano alla volta.')}
<div class="${state.platform==='web'?'sp-web-grid':''}"><div><section class="sp-hero"><span class="sp-pill">${icon('sparkles')} PROSSIMO CONCERTO</span><h2>Live al Riverside</h2><p class="sp-sub">Sabato 14 novembre · 21:30</p><div class="sp-hero-meta"><span>${icon('list-music')}${set.length} brani</span><span>${icon('clock-3')}${mm(total())} min</span><span>${icon('music-2')}Set di apertura</span></div><button class="sp-primary" data-page="stage">${icon('play')}Vai sul palco</button></section><div class="sp-stats"><div class="sp-stat"><strong>${songs.length}</strong><small>brani in repertorio</small></div><div class="sp-stat"><strong>${songs.filter(s=>s.status==='ready').length}</strong><small>pronti da suonare</small></div><div class="sp-stat"><strong>1</strong><small>scaletta pronta</small></div></div></div><div><div class="sp-section-head"><h2>La prossima prova</h2><button class="sp-link" data-page="practice">Apri ${icon('arrow-up-right')}</button></div><button class="sp-task" data-page="practice"><span class="sp-task-icon">${icon('audio-lines')}</span><span><strong>${pending?pending+' brani su cui concentrarsi':'La band è pronta'}</strong><span class="sp-tiny">${pending?'Due passaggi, poi si suona.':'Tutti i brani sono pronti.'}</span></span>${icon('chevron-right')}</button><div class="sp-section-head"><h2>Riprendi da qui</h2><span class="sp-tiny">REPERTORIO</span></div>${songRow(songs[1],true)}<div class="sp-quick"><button class="sp-secondary" data-page="import">${icon('clipboard-paste')}Importa brano</button><button class="sp-secondary" data-page="sets">${icon('list-plus')}Crea scaletta</button></div>${state.platform==='web'?'<div class="sp-hairline"></div><div class="sp-note">Prepara sul PC. Suona sul tablet.<br>Gli accordi e le tue note, sempre a portata di mano.</div>':''}</div></div>`}
function songRow(s,compact=false){return `<div class="sp-songrow"><button class="sp-song-open" data-song="${s.id}"><span class="sp-cover">${icon('music-2')}</span><span class="sp-songtext"><strong>${escape(s.title)}</strong><small>${escape(s.artist)} · ${s.bpm} BPM</small></span></button>${!compact?`<span class="sp-hide-mobile">${status(s)}</span>`:''}<span class="sp-key">${escape(s.key)}</span>${!compact?`<span class="sp-songmeta"><span>${s.dur}</span></span>`:''}</div>`}
function repertoire(){let found=songs.filter(s=>(state.filter==='all'||s.status===state.filter)&&(s.title+' '+s.artist).toLowerCase().includes(state.query.toLowerCase()));return `${pageHead('Repertorio',songs.length+' brani. Un posto per tutte le tue canzoni.',`<button class="sp-iconbtn" data-page="import" aria-label="Importa brano">${icon('plus')}</button>`)}<label class="sp-search">${icon('search')}<input id="sp-search" aria-label="Cerca brani" placeholder="Cerca un brano o un artista…" value="${escape(state.query)}"></label><div class="sp-filters">${[['all','Tutti'],['ready','Pronti'],['rehearse','Da ripassare'],['study','Da studiare']].map(([id,t])=>`<button class="sp-chip ${state.filter===id?'active':''}" data-filter="${id}">${t}</button>`).join('')}</div><div class="sp-list-head"><span>BRANO / ARTISTA</span><span>TONALITÀ · DURATA</span></div><div id="sp-song-list">${found.length?found.map(s=>songRow(s)).join(''):'<div class="sp-empty">Nessun brano trovato.<br>Prova un altro titolo.</div>'}</div><div class="sp-end-actions"><button class="sp-secondary" data-action="new-song">${icon('plus')}Nuovo brano</button><button class="sp-primary" data-page="import">${icon('clipboard-paste')}Importa</button></div>`}
function setlist(){return `${pageHead('Le tue scalette','La serata prende forma qui.',`<button class="sp-iconbtn" data-action="rename-set" aria-label="Rinomina scaletta">${icon('pencil')}</button>`)}<section class="sp-set-info"><span class="sp-pill">${icon('radio-tower')}LIVE</span><h2>${escape(state.setName||'Set di apertura')}</h2><div class="sp-row sp-between"><span class="sp-sub">${set.length} brani · ${mm(total())} minuti</span><button class="sp-link" data-page="stage">Suona ${icon('arrow-up-right')}</button></div></section><div class="sp-list-head"><span>ORDINE DEL SET</span><span>SPOSTA</span></div>${set.map((id,i)=>{let s=songs.find(s=>s.id===id);return `<div class="sp-songrow" draggable="true" data-drag="${i}"><span class="sp-number">${String(i+1).padStart(2,'0')}</span><button class="sp-song-open" data-song="${id}"><span class="sp-songtext"><strong>${escape(s.title)}</strong><small>${s.bpm} BPM · ${s.key} · ${s.dur}</small></span></button><div class="sp-reorder"><button data-move="${i}" data-delta="-1" aria-label="Sposta ${escape(s.title)} su" ${i===0?'disabled':''}>${icon('arrow-up')}</button><button data-move="${i}" data-delta="1" aria-label="Sposta ${escape(s.title)} giù" ${i===set.length-1?'disabled':''}>${icon('arrow-down')}</button></div></div>`}).join('')}<div class="sp-end-actions"><button class="sp-secondary" data-action="add-to-set">${icon('plus')}Aggiungi brano</button><button class="sp-primary" data-page="stage">${icon('play')}Avvia il set</button></div>`}
function clean(text){let removed=0,title='',artist='',key='';const lines=text.replace(/\r/g,'').split('\n').filter(l=>{if(/^(Tuning|Key|Capo|Difficulty|Last update|Rating|Views|Favorites)\s*:/i.test(l.trim())){if(/^Key:/i.test(l.trim()))key=l.split(':')[1].trim();removed++;return false}let m=l.match(/^(.+?)\s+chords\s+by\s+(.+)$/i);if(m){title=m[1];artist=m[2];removed++;return false}return true});let out=[];const chord=/^(?:[A-G](?:#|b)?(?:m|maj|min|sus|dim|aug|add)?\d*(?:\([^)]*\))?(?:\/[A-G][#b]?)?|[|:%]|x\d+)$/;const isChord=l=>l.trim()&&l.trim().split(/\s+/).every(t=>chord.test(t));for(let i=0;i<lines.length;i++){let line=lines[i];if(/^\s*\[([^\]]+)\]\s*$/.test(line)&&!chord.test(line.trim().slice(1,-1))){out.push('# '+line.trim().slice(1,-1));continue}if(isChord(line)){let next=lines[i+1];if(next&&next.trim()&&!isChord(next)&&!/^\s*\[/.test(next)){let lyric=next;const matches=[...line.matchAll(/\S+/g)].filter(m=>/^[A-G]/.test(m[0]));matches.reverse().forEach(m=>{let at=m.index;lyric=lyric.padEnd(at,' ');lyric=lyric.slice(0,at)+'['+m[0]+']'+lyric.slice(at)});out.push(lyric);i++}else out.push(line.replace(/\b([A-G](?:#|b)?(?:m|maj|sus|dim|add)?\d*(?:\/[A-G][#b]?)?)\b/g,'[$1]'));continue}out.push(line)}return {body:out.join('\n').trim(),removed,title,artist,key}}
function chart(body,trans=0){return body.split('\n').map(line=>{if(!line.trim())return '<div style="height:9px"></div>';if(line.startsWith('#'))return `<div class="sp-chart-section">${escape(line.slice(1).trim().replace(/^Verse/i,'Strofa').replace(/^Chorus/i,'Ritornello'))}</div>`;let out='',last=0,ch='';const matches=[...line.matchAll(/\[([^\]]+)\]/g)];if(!matches.length)return `<div class="sp-lyric-line"><span class="sp-piece"><b>&nbsp;</b>${escape(line)}</span></div>`;for(const m of matches){let tx=line.slice(last,m.index);if(tx||ch)out+=`<span class="sp-piece"><b>${ch?escape(transpose(ch,trans)):'&nbsp;'}</b>${escape(tx)||'&nbsp;'}</span>`;ch=m[1];last=m.index+m[0].length}out+=`<span class="sp-piece"><b>${escape(transpose(ch,trans))}</b>${escape(line.slice(last))||'&nbsp;'}</span>`;return `<div class="sp-lyric-line">${out}</div>`}).join('')}
function transpose(ch,n){const pcs={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};return ch.replace(/[A-G][#b]?/g,m=>['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'][(pcs[m]+n+120)%12])}
function importer(){let c=clean(state.raw);return `${pageHead('Da testo a canzone.','Incolla gli accordi. Al resto pensa StagePilot.',`<button class="sp-iconbtn" data-page="songs" aria-label="Chiudi importazione">${icon('x')}</button>`)}<div class="sp-import-grid"><div><div class="sp-row sp-between"><span class="sp-sub"><span class="sp-step">1</span>INCOLLA</span><button class="sp-link" data-action="sample">Usa l’esempio</button></div><label class="sp-form-label" for="sp-raw">Testo da Ultimate Guitar o ChordPro</label><textarea class="sp-input" id="sp-raw" spellcheck="false">${escape(state.raw)}</textarea><p class="sp-tiny" style="margin-top:8px">Testo e accordi restano tuoi. Nessuna riscrittura delle parole.</p><button class="sp-primary sp-wide" style="margin-top:15px" data-action="clean">${icon('wand-sparkles')}Pulisci e prepara</button>${state.cleaned?`<div class="sp-import-success">${icon('check-check')}${c.removed} righe di servizio rimosse · accordi allineati</div>`:''}</div><div>${state.cleaned?`<span class="sp-sub"><span class="sp-step">2</span>CONTROLLA L’ANTEPRIMA</span><div class="sp-form-grid"><div><label class="sp-form-label" for="sp-import-title">Titolo</label><input class="sp-input" id="sp-import-title" value="${escape(c.title||'Nuovo brano')}"></div><div><label class="sp-form-label" for="sp-import-artist">Artista</label><input class="sp-input" id="sp-import-artist" value="${escape(c.artist)}"></div></div><div class="sp-preview-chart">${chart(c.body)}</div><button class="sp-primary sp-wide" style="margin-top:15px" data-action="save-import">${icon('check')}Aggiungi ai brani</button>`:`<div class="sp-drop">${icon('file-music')}<h3>Il tuo brano, pronto per il leggio.</h3><p class="sp-sub">Via intestazioni e testo del sito.<br>Restano sezioni, parole e accordi.</p></div><div class="sp-note">Funziona anche con i tuoi file ChordPro e con accordi già tra parentesi quadre.</div>`}</div></div>`}
function practice(){let pending=songs.filter(s=>s.status!=='ready');return `${pageHead('Una prova che conta.','Meno «da dove partiamo?». Più musica.')}<section class="sp-practice-hero"><span class="sp-pill" style="background:#b5a5dd15;color:var(--sp-purple)">${icon('audio-lines')}FOCUS DELLA BAND</span><h2>${pending.length?pending.length+' brani, un passo avanti.':'Tutti pronti per il palco.'}</h2><p class="sp-sub">I passaggi da sistemare, già in ordine.</p><div class="sp-progress"><div style="width:${songs.filter(s=>s.status==='ready').length/songs.length*100}%"></div></div><div class="sp-row sp-between"><span class="sp-tiny">${songs.filter(s=>s.status==='ready').length} di ${songs.length} brani pronti</span>${icon('check-check')}</div></section><div class="sp-session-bar"><div><div class="sp-kicker">TEMPO DI PROVA</div><span id="sp-timer" class="sp-timer">${mm(state.timer)}</span></div><button class="${state.practicing?'sp-secondary':'sp-primary'}" data-action="practice-timer">${icon(state.practicing?'square':'play')}${state.practicing?'Termina prova':'Inizia prova'}</button></div><div class="sp-section-head"><h2>Da lavorare insieme</h2><span class="sp-tiny">SPUNTA QUANDO È PRONTO</span></div>${pending.length?pending.map(s=>`<div class="sp-practice-row"><label class="sp-practice-top"><input type="checkbox" data-ready="${s.id}" aria-label="${escape(s.title)} pronto"><span class="sp-songtext"><strong>${escape(s.title)}</strong><small>${s.bpm} BPM · ${s.key}</small></span>${status(s)}</label><p>${escape(s.note||'Aggiungi un promemoria per la prossima prova.')}</p><button class="sp-link" style="margin-left:29px" data-song="${s.id}">${icon('pencil')}Modifica appunto</button></div>`).join(''):`<div class="sp-empty">${icon('party-popper')}<p>Nessun passaggio in sospeso.<br>La prossima tappa è il palco.</p></div>`}`}
function stage(){let s=songs.find(s=>s.id===set[state.live])||songs[0],next=songs.find(s=>s.id===set[state.live+1]);let parts=['Intro','Strofa','Ritornello'];let bodies=[`# Intro\n[Am]      [F]      [C]      [G]\n\n# Un respiro. Poi si parte.\n[Am]      [F]      [C]      [G]`,`# Strofa 1\n[Am]La città si accende\ne noi re[F]stiamo qui\n[C]Tra le luci e il suono\ndi un altro [G]venerdì\n\n[Am]La notte ci somiglia\ne non ci [F]chiede niente`,`# Ritornello\n[F]Suona ancora, [C]suona forte\n[G]Questa notte non fi[Am]nisce mai\n\n[F]Suona ancora, [C]suona forte\n[G]Fino all’ultimo [Am]giro`];return `<div class="sp-stage ${state.locked?'locked':''}"><div class="sp-stage-top"><button class="sp-iconbtn" data-page="sets" aria-label="Torna alla scaletta">${icon('arrow-left')}</button><div><div class="sp-kicker">${String(state.live+1).padStart(2,'0')} / ${set.length} · SET DI APERTURA</div><h1 class="sp-stage-title">${escape(s.title)}</h1><div class="sp-stage-sub">${escape(s.artist)} · ${s.bpm} BPM · ${s.dur}</div></div><span class="sp-stage-key">${transpose(s.key,state.tr)}</span></div><div class="sp-stage-sections">${parts.map((p,i)=>`<button data-section="${i}" class="${state.section===i?'active':''}">${p}</button>`).join('')}<button data-action="live-size" aria-label="Aumenta dimensione testo" style="margin-left:auto">A+</button></div><div class="sp-stage-chart" style="--sp-live-size:${state.liveSize||20}px"><div class="sp-note">${escape(s.note||'Respira. La prossima nota è tua.')}</div>${chart(bodies[state.section].replaceAll('[Am]',s.key.endsWith('m')?'[Am]':'[C]'),state.tr+({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[s.key[0]]+(s.key.includes('#')?1:s.key.includes('b')?-1:0)-(s.key.endsWith('m')?9:0)))}<div class="sp-progress" style="margin-top:30px"><div style="width:${state.playing?38:12}%;background:var(--sp-accent)"></div></div><p class="sp-tiny">${state.playing?'Scorrimento attivo':'Scorrimento in pausa'} · ${state.locked?'Touch bloccato':'Pronto quando lo sei tu'}</p></div><div class="sp-stage-next">PROSSIMO <strong>${escape(next?.title||'Fine scaletta')}</strong><span style="margin-left:auto">${next?escape(next.key):''}</span></div><div class="sp-stage-controls"><div class="sp-transpose"><button data-transpose="-1" aria-label="Abbassa un semitono">−</button><span>${state.tr>0?'+':''}${state.tr}</span><button data-transpose="1" aria-label="Alza un semitono">+</button></div><button class="sp-primary" data-action="live-play">${icon(state.playing?'pause':'play')}${state.playing?'Pausa':'Scorri'}</button><button class="sp-iconbtn" data-action="live-next" aria-label="Prossimo brano" ${next?'':'disabled'}>${icon('skip-forward')}</button><button class="sp-iconbtn" data-action="lock" aria-label="${state.locked?'Sblocca':'Blocca'} touch" aria-pressed="${state.locked}">${icon(state.locked?'lock-keyhole':'lock-open')}</button></div></div>`}
function modal(){let m=state.modal;if(!m)return '';let content='';if(m.type==='song'){let s=songs.find(s=>s.id===m.id);content=`<h2>${escape(s.title)}</h2><p class="sp-sub">${escape(s.artist)} · ${s.bpm} BPM · ${s.key}</p><label class="sp-form-label" for="sp-status-edit">Preparazione</label><select id="sp-status-edit" class="sp-input">${Object.keys(statusText).map(k=>`<option value="${k}" ${s.status===k?'selected':''}>${statusText[k]}</option>`).join('')}</select><label class="sp-form-label" for="sp-note-edit">Cosa ricordare in prova</label><textarea id="sp-note-edit" class="sp-input" style="min-height:110px">${escape(s.note)}</textarea><div class="sp-end-actions"><button class="sp-secondary" data-action="close-modal">Annulla</button><button class="sp-primary" data-action="save-song">Salva modifiche</button></div>`}else if(m.type==='rename'){content=`<h2>Il nome della serata</h2><label class="sp-form-label" for="sp-set-name">Nome scaletta</label><input id="sp-set-name" class="sp-input" value="${escape(state.setName||'Set di apertura')}"><div class="sp-end-actions"><button class="sp-secondary" data-action="close-modal">Annulla</button><button class="sp-primary" data-action="save-set-name">Salva</button></div>`}else if(m.type==='new'){content=`<h2>Un nuovo brano.</h2><label class="sp-form-label" for="sp-new-title">Titolo</label><input id="sp-new-title" class="sp-input" placeholder="Come si chiama?"><label class="sp-form-label" for="sp-new-artist">Artista</label><input id="sp-new-artist" class="sp-input" placeholder="Nome artista o band"><div class="sp-end-actions"><button class="sp-secondary" data-action="close-modal">Annulla</button><button class="sp-primary" data-action="save-new">Crea brano</button></div>`}else if(m.type==='add'){let available=songs.filter(s=>!set.includes(s.id));content=`<h2>Aggiungi alla scaletta</h2>${available.length?available.map(s=>`<button class="sp-task" style="margin-top:12px" data-add="${s.id}"><strong>${escape(s.title)}</strong>${icon('plus')}</button>`).join(''):'<p class="sp-sub">Tutti i brani sono già in questa scaletta. Importane uno nuovo dal repertorio.</p>'}<button class="sp-secondary sp-wide" style="margin-top:18px" data-action="close-modal">Chiudi</button>`}else{content=`<div class="sp-row sp-between"><h2>Il tuo studio, con te.</h2><button class="sp-iconbtn" data-action="close-modal" aria-label="Chiudi">${icon('x')}</button></div><p class="sp-sub">Prepara i brani da qui e portali su Android. Sul palco, tutto resta disponibile offline.</p><div class="sp-note" style="margin:18px 0">Questa è l’anteprima grafica. Il collegamento tra PC e tablet arriverà nella versione funzionante.</div><button class="sp-primary sp-wide" data-action="close-modal">Ho capito</button>`}return `<div class="sp-modal-overlay"><section class="sp-modal" role="dialog" aria-modal="true" aria-label="${m.type==='song'?'Modifica brano':'StagePilot'}">${content}</section></div>`}
function render(){root.style.setProperty('--sp-accent',state.accent);root.style.setProperty('--sp-radius',state.radius+'px');root.querySelectorAll('[data-platform]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.platform===state.platform)));let side=`<aside class="sp-sidebar"><div class="sp-logo"><span class="sp-logo-mark">${icon('radio-tower')}</span>StagePilot<span style="color:var(--sp-muted);font-size:9px;letter-spacing:1px;align-self:end;margin-bottom:4px">STUDIO</span></div><nav class="sp-navlist" aria-label="Navigazione studio">${nav()}</nav><div class="sp-side-bottom"><button class="sp-secondary" data-action="connect">${icon('tablet-smartphone')}Collega Android</button><div class="sp-band"><span class="sp-avatar">CC</span><span>COPYCUT<br><span class="sp-tiny">La tua band</span></span></div></div></aside>`;let main=state.page==='stage'?stage():`<div class="sp-content"><header class="sp-top">${state.platform==='android'?`<div class="sp-logo"><span class="sp-logo-mark">${icon('radio-tower')}</span>StagePilot</div>`:`<span class="sp-kicker">WORKSPACE / COPYCUT</span>`}<button class="sp-link" data-action="connect" aria-label="Collegamento tra PC e Android"><span class="sp-connected">${icon('cloud-off')}OFFLINE FIRST</span></button></header><main class="sp-main">${({home,songs:repertoire,sets:setlist,import:importer,practice}[state.page]||home)()}</main><nav class="sp-bottom" aria-label="Navigazione StagePilot">${nav()}</nav></div>`;mount.innerHTML=`<div class="sp-app sp-${state.platform}" aria-label="StagePilot ${state.platform==='android'?'Android':'Studio web'}">${state.page==='stage'?'':state.platform==='web'?side:''}${main}${modal()}${state.toast?`<div class="sp-toast" role="status">${icon('check')}${escape(state.toast)}</div>`:''}</div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})}
root.addEventListener('input',e=>{if(e.target.id==='sp-raw'){state.raw=e.target.value;state.cleaned=false}if(e.target.id==='sp-search'){state.query=e.target.value;let focus=e.target.selectionStart;render();let q=root.querySelector('#sp-search');q.focus();q.setSelectionRange(focus,focus)}});
root.addEventListener('change',e=>{let id=e.target.dataset.ready;if(id){songs.find(s=>s.id===id).status='ready';toast('Un altro brano pronto per il palco.')}});
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.platform){state.platform=b.dataset.platform;render();persist();return}if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.song){state.modal={type:'song',id:b.dataset.song};render();return}if(b.dataset.move!==undefined){let from=+b.dataset.move,to=from+Number(b.dataset.delta);if(to>=0&&to<set.length){set.splice(to,0,set.splice(from,1)[0]);render()}return}if(b.dataset.section!==undefined){state.section=+b.dataset.section;render();return}if(b.dataset.transpose){state.tr=Math.max(-11,Math.min(11,state.tr+Number(b.dataset.transpose)));render();return}if(b.dataset.add){set.push(b.dataset.add);state.modal=null;toast('Brano aggiunto alla scaletta.');return}switch(b.dataset.action){case 'clean':state.cleaned=!!state.raw.trim();if(!state.cleaned)toast('Incolla prima il testo del brano.');else render();break;case 'sample':state.raw=sample;state.cleaned=false;render();break;case 'save-import':{let c=clean(state.raw),title=root.querySelector('#sp-import-title').value.trim(),artist=root.querySelector('#sp-import-artist').value.trim();if(!title){toast('Aggiungi un titolo.');return}songs.push({id:'s'+Date.now(),title,artist,key:c.key||'Am',bpm:120,dur:'3:00',status:'study',note:'Brano importato. Controlla tonalità, tempo e durata.'});navigate('songs');toast('Brano preparato e aggiunto al repertorio.');break}case 'close-modal':state.modal=null;render();break;case 'save-song':{let s=songs.find(s=>s.id===state.modal.id);s.status=root.querySelector('#sp-status-edit').value;s.note=root.querySelector('#sp-note-edit').value;state.modal=null;toast('Promemoria e preparazione aggiornati.');break}case 'rename-set':state.modal={type:'rename'};render();break;case 'save-set-name':state.setName=root.querySelector('#sp-set-name').value.trim()||'Set di apertura';state.modal=null;render();break;case 'add-to-set':state.modal={type:'add'};render();break;case 'new-song':state.modal={type:'new'};render();break;case 'save-new':{let title=root.querySelector('#sp-new-title').value.trim();if(!title)return;let artist=root.querySelector('#sp-new-artist').value.trim();songs.push({id:'s'+Date.now(),title,artist,key:'C',bpm:120,dur:'3:00',status:'study',note:''});state.modal=null;toast('Nuovo brano creato nell’anteprima.');break}case 'connect':state.modal={type:'connect'};render();break;case 'practice-timer':state.practicing=!state.practicing;if(!state.practicing)toast('Prova conclusa: '+mm(state.timer)+' di musica insieme.');else render();break;case 'live-play':state.playing=!state.playing;render();break;case 'live-next':if(state.live<set.length-1){state.live++;state.tr=0;state.section=0;state.playing=false;render()}break;case 'lock':state.locked=!state.locked;render();break;case 'live-size':state.liveSize=state.liveSize===26?20:(state.liveSize||20)+2;render();break}});
let dragFrom=null;root.addEventListener('dragstart',e=>{let row=e.target.closest('[data-drag]');if(row){dragFrom=+row.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragFrom))}});root.addEventListener('dragover',e=>{if(e.target.closest('[data-drag]'))e.preventDefault()});root.addEventListener('drop',e=>{let row=e.target.closest('[data-drag]');if(row&&dragFrom!==null){e.preventDefault();let to=+row.dataset.drag;set.splice(to,0,set.splice(dragFrom,1)[0]);dragFrom=null;render()}});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
setInterval(()=>{if(state.practicing){state.timer++;let t=root.querySelector('#sp-timer');if(t)t.textContent=mm(state.timer)}},1000);
render();
if(globalThis.Tweak){let tweak=new Tweak({container:root,onChange:()=>{render();persist()}});tweak.addColorPicker(state,'accent',{label:'Accento StagePilot',reference:'--sp-accent'});tweak.addSlider(state,'radius',{label:'Angoli delle superfici',min:8,max:28,step:2,unit:'px',reference:'--sp-radius'})}
})();
</script>
